<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    
    <title>Frontend Mentor | QR code component</title>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="global.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  </head>

  <body>
    <main>
      <div class="card-center">
        <div class="card-dimensions white corner-20 shadow">
          <img
            src="images/image-qr-code.png"
            alt="White QR code with blue background"
            class="img-dimensions corner-10"
          />
          <div class="text-padding text-center">
            <h1 class="h1-margin">Improve your front-end skills by building projects</h1>
            <p>
              Scan the QR code to visit Frontend Mentor and take your coding skills to the next level
            </p>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <div class="attribution">
        Challenge by <a href="https://www.frontendmentor.io/challenges/qr-code-component-iux_sIO_H" target="_blank">Frontend Mentor</a>. 
        Coded by <a href="https://github.com/clucksupremacy" target="_blank">clucksupremacy</a>.
      </div>
    </footer>
  </body>
</html>
